services:
  pc-agent:
    image: verdox/solar-miner-pc-agent:latest
    # For beta builds use
    #image: verdox/solar-miner-pc-agent:latest-beta
    container_name: solarminer-pc-agent
    restart: unless-stopped
    # The image includes a local proxy. The UI defaults to an external proxy;
    # operators can switch to the bundled loopback-only proxy at any time.
    ports:
      - "8084:8084"
      - "8091:8091/udp"
    init: true
    cap_add:
      - IPC_LOCK
    ulimits:
      memlock: -1
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ./data:/data
    environment:
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70.0 -Djava.awt.headless=true
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent http://127.0.0.1:8084/api/agent/external/identity >/dev/null || exit 1
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
